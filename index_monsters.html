<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中华精怪出没图鉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f0e2; --paper-2:#f0e6d1; --paper-3:#e7d9bd;
    --card:#fffcf4;
    --ink:#2b231b; --ink-2:#6b5a45; --ink-3:#9a886e;
    --line:#d8c8a8; --line-soft:#e8dcc2;
    --seal:#a5322a; --gold:#a8874e;
    --c-shou:#8a5a2b; --c-qin:#3f6e5a; --c-lin:#2f5f7a; --c-cao:#5d7a2f; --c-qi:#7a5a7a; --c-gui:#4a4a5a;
    --lv1:#5d7a2f; --lv2:#9a8a2a; --lv3:#c27a1e; --lv4:#b2342a; --lv5:#6e1c16;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --brush:"Ma Shan Zheng","STKaiti","Kaiti SC","KaiTi","楷体",var(--serif);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.75;-webkit-font-smoothing:antialiased}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 10% 4%, rgba(165,50,42,.05), transparent 34%),
      radial-gradient(ellipse at 92% 88%, rgba(63,112,96,.055), transparent 40%),
      radial-gradient(rgba(120,95,60,.055) 1px, transparent 1px);
    background-size:auto,auto,6px 6px;
  }
  .frame{position:fixed;inset:14px;border:1px solid rgba(168,135,78,.26);pointer-events:none;z-index:1}
  .frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(168,135,78,.13)}
  .corner{position:absolute;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);opacity:.7}
  .corner.tl{top:-4px;left:-4px}.corner.tr{top:-4px;right:-4px}
  .corner.bl{bottom:-4px;left:-4px}.corner.br{bottom:-4px;right:-4px}
  .wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:0 30px}
  @media (max-width:600px){.wrap{padding:0 20px}.frame{inset:8px}}

  .cat-shou{--cat:#8b5a2c;--cat-soft:#f2e6d4}
  .cat-qin {--cat:#3f7060;--cat-soft:#e1ece6}
  .cat-lin {--cat:#35657d;--cat-soft:#dfeaf0}
  .cat-cao {--cat:#5f7a35;--cat-soft:#e8eeda}
  .cat-qi  {--cat:#7a5674;--cat-soft:#efe2ee}
  .cat-gui {--cat:#4b4a5e;--cat-soft:#e5e4eb}

  /* 卷首 */
  .masthead{display:flex;gap:26px;align-items:center;padding:54px 0 26px;flex-wrap:wrap}
  .seal-group{display:flex;gap:10px;align-items:flex-start;flex:none}
  .seal{
    width:76px;height:76px;flex:none;display:grid;place-items:center;
    background:var(--seal);color:#fff8ea;font-family:var(--brush);font-size:48px;line-height:1;
    border-radius:5px;transform:rotate(-5deg);position:relative;
    box-shadow:0 2px 0 rgba(120,35,28,.25),inset 0 0 0 3px rgba(255,255,255,.16);
    text-shadow:0 1px 1px rgba(90,20,15,.35);
  }
  .seal::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,248,234,.42);border-radius:2px}
  .seal-cap{
    writing-mode:vertical-rl;font-family:var(--brush);font-size:15px;letter-spacing:.35em;
    color:var(--seal);border:1px solid rgba(165,50,42,.45);padding:8px 4px;border-radius:3px;
    background:rgba(165,50,42,.04);line-height:1.2;
  }
  .mast-text{flex:1;min-width:270px}
  .eyebrow{font-size:12px;letter-spacing:.34em;color:var(--gold);margin-bottom:10px}
  .eyebrow i{display:inline-block;width:5px;height:5px;background:var(--gold);transform:rotate(45deg);margin:0 10px;vertical-align:middle}
  h1{font-family:var(--brush);font-weight:400;font-size:clamp(38px,6.4vw,62px);letter-spacing:.09em;line-height:1.12;margin:0;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .sub{margin:12px 0 0;color:var(--ink-2);font-size:15px}
  .sub em{font-style:normal;color:var(--seal);border-bottom:1px solid rgba(165,50,42,.35);padding-bottom:1px}
  .mast-side{display:flex;gap:16px;align-items:center;flex:none}
  .colophon{writing-mode:vertical-rl;font-size:12px;line-height:1.9;letter-spacing:.12em;color:var(--ink-3);border-right:1px solid var(--line);padding-right:14px;height:88px}
  .round-seal{width:56px;height:56px;border:2px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;font-family:var(--brush);font-size:19px;line-height:1.15;text-align:center;transform:rotate(8deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px rgba(165,50,42,.45)}
  @media (max-width:760px){.mast-side{display:none}.masthead{padding:38px 0 20px;gap:18px}}
  .rule{display:flex;align-items:center;gap:14px;margin:0 0 22px;color:var(--gold)}
  .rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),var(--line))}
  .rule span:last-child{background:linear-gradient(90deg,var(--line),var(--line),transparent)}
  .rule i{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);flex:none}

  /* 检索 */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;gap:7px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:rgba(255,252,244,.7);color:var(--ink-2);padding:6px 14px;border-radius:3px;cursor:pointer;font:inherit;font-size:14px;position:relative;transition:all .18s ease}
  .tab:hover{border-color:var(--gold);color:var(--ink)}
  .tab .n{font-size:11px;margin-left:6px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);padding-left:17px}
  .tab[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--seal)}
  .tab[aria-pressed="true"] .n{color:rgba(246,240,226,.6)}
  .grow{flex:1}
  .select,.search-wrap{border:1px solid var(--line);background:rgba(255,252,244,.8);border-radius:3px;color:var(--ink)}
  .select{padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
  .select:focus{outline:none;border-color:var(--seal)}
  .search-wrap{display:flex;align-items:center;gap:8px;padding:0 12px;transition:border-color .18s}
  .search-wrap:focus-within{border-color:var(--seal)}
  .search-wrap svg{flex:none;color:var(--ink-3)}
  .search{border:0;background:transparent;outline:none;padding:8px 0;font:inherit;font-size:14px;min-width:180px;color:var(--ink)}
  .search::placeholder{color:var(--ink-3)}
  .legend-btn{border:1px solid var(--seal);background:transparent;color:var(--seal);padding:8px 15px;border-radius:3px;cursor:pointer;font:inherit;font-size:14px;transition:all .18s}
  .legend-btn:hover{background:rgba(165,50,42,.07)}
  .rand{border:1px solid var(--seal);background:var(--seal);color:#fff8ea;padding:8px 17px;border-radius:3px;cursor:pointer;font:inherit;font-size:14px;letter-spacing:.06em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .18s,filter .18s}
  .rand:hover{filter:brightness(1.09);transform:translateY(-1px)}
  @media (max-width:520px){.search-wrap{flex:1 1 100%}.search{min-width:0;width:100%}.select,.rand,.legend-btn{flex:1}}

  /* 目录 */
  main{padding-bottom:36px}
  .count{color:var(--ink-3);font-size:12px;letter-spacing:.18em;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .count::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(242px,1fr));gap:15px}
  .card{position:relative;background:linear-gradient(155deg,var(--card),#f8f1e2);border:1px solid var(--line);border-radius:4px;padding:15px 16px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;overflow:hidden;display:block;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;animation:fadeUp .42s both;animation-delay:calc(var(--i,0)*18ms)}
  .card::before,.card::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;opacity:.55}
  .card::before{top:5px;left:5px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
  .card::after{bottom:5px;right:5px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 26px rgba(80,55,20,.13);border-color:var(--seal);outline:none}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
  .card-no{font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
  .tag{font-size:11px;letter-spacing:.12em;padding:1px 8px;border-radius:2px;border:1px solid var(--cat);background:var(--cat-soft);color:var(--cat)}
  .card-main{display:flex;gap:13px;align-items:center}
  .glyph{width:60px;height:60px;flex:none;display:grid;place-items:center;position:relative;background:var(--cat-soft);color:var(--cat);border:1px solid var(--cat);border-radius:4px;font-family:var(--brush);font-size:35px;line-height:1}
  .glyph::after{content:"";position:absolute;inset:4px;border:1px solid currentColor;opacity:.32;border-radius:2px}
  .card h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:.03em}
  .card .place{margin:0;color:var(--ink-2);font-size:12px;line-height:1.6}
  .card-level{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;font-weight:600}
  .lv-text{letter-spacing:.06em}
  .pips{display:inline-flex;gap:3px}
  .pip{width:8px;height:8px;border-radius:2px;border:1px solid currentColor;opacity:.85}
  .pip.on{background:currentColor}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-3)}
  .card-check.ok{color:var(--lv1)}
  .card-foot .more{color:var(--seal);opacity:0;transform:translateX(-4px);transition:all .2s}
  .card:hover .more,.card:focus-visible .more{opacity:1;transform:translateX(0)}
  .empty{grid-column:1/-1;color:var(--ink-2);padding:56px 0;text-align:center;font-size:15px;letter-spacing:.08em}
  .empty::before{content:"◇";display:block;font-size:26px;color:var(--gold);margin-bottom:10px}
  footer{border-top:1px solid var(--line);padding:18px 0 52px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:var(--ink-3);font-size:12px;letter-spacing:.04em}
  footer span:first-child{max-width:820px}
  .foot-seal{font-family:var(--brush);font-size:15px;color:var(--seal);border:1px solid rgba(165,50,42,.5);padding:3px 9px;border-radius:3px;transform:rotate(-3deg);flex:none}

  /* 详情卷轴 */
  .mask{position:fixed;inset:0;background:rgba(38,28,18,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .mask.open{display:flex}
  .sheet{background:var(--paper);max-width:680px;width:100%;max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--line);box-shadow:0 28px 70px rgba(20,12,4,.4);position:relative;animation:sheetIn .26s ease both}
  .rod{height:15px;background:linear-gradient(#7a5730,#4b341f 45%,#7a5730);display:flex;align-items:center;padding:0 8px;gap:8px}
  .rod i{width:16px;height:19px;border-radius:3px;background:linear-gradient(90deg,#3a2716,#6b4a29,#3a2716);flex:none}
  .rod span{flex:1;height:1px;background:rgba(255,235,200,.18)}
  .rod-bottom{background:linear-gradient(#7a5730,#4b341f 55%,#7a5730)}
  .sheet-inner{background:linear-gradient(180deg,#fffdf6,#f7efdd);padding:0 30px 6px;position:relative}
  .sheet-inner::before,.sheet-inner::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
  .sheet-inner::before{left:12px}.sheet-inner::after{right:12px}
  .close{position:absolute;top:12px;right:18px;border:1px solid var(--line);background:rgba(255,252,244,.9);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2);z-index:2;transition:all .18s}
  .close:hover{border-color:var(--seal);color:var(--seal);transform:rotate(90deg)}
  .sheet-head{display:flex;gap:20px;align-items:center;padding:30px 40px 22px 8px;border-bottom:1px double var(--line);position:relative}
  .sheet-head .glyph{width:78px;height:78px;font-size:46px}
  .sheet-head h2{margin:0;font-family:var(--brush);font-weight:400;font-size:36px;letter-spacing:.06em;line-height:1.2}
  .sheet-head .place{color:var(--ink-2);margin:6px 0 0;font-size:13px}
  .head-cat{position:absolute;right:8px;top:30px;writing-mode:vertical-rl;font-family:var(--brush);font-size:15px;letter-spacing:.28em;color:var(--cat);border:1px solid var(--cat);padding:7px 4px;border-radius:2px;background:var(--cat-soft)}
  .sheet-index{position:absolute;right:8px;bottom:20px;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
  .sheet-body{padding:4px 8px 8px;margin:0}
  .row{display:grid;grid-template-columns:5.4em 1fr;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row dt{color:var(--seal);font-weight:600;font-size:13px;letter-spacing:.16em;padding-left:12px;position:relative}
  .row dt::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--seal);transform:rotate(45deg)}
  .row dd{margin:0;font-size:15px;color:var(--ink);min-width:0}
  .quote{background:linear-gradient(160deg,#fbf5e6,#f4e8d0);border:1px solid var(--line);border-left:3px double var(--seal);padding:12px 18px;margin-top:2px;position:relative}
  .quote .src{display:block;color:var(--ink-3);font-size:12px;letter-spacing:.1em;margin-bottom:5px}
  .quote p{margin:0;font-size:15px;line-height:1.95}
  .quote::after{content:"「";position:absolute;right:10px;bottom:-14px;font-size:46px;color:rgba(165,50,42,.1);font-family:var(--brush)}
  .src-inline{color:var(--ink-2)}
  .tip{background:rgba(165,50,42,.05);border-left:2px solid var(--seal);padding:8px 14px;font-style:italic;color:#6d4234}
  .note{color:var(--ink-2);font-size:14px}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 8px 22px;border-top:1px double var(--line)}
  .btn{border:1px solid var(--line);background:rgba(255,252,244,.8);padding:7px 15px;border-radius:3px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink-2);transition:all .18s}
  .btn:hover{border-color:var(--seal);color:var(--seal)}
  .hint{font-size:11px;color:var(--ink-3);letter-spacing:.06em}

  /* 危险等级 */
  .danger{border:1px solid currentColor;border-left:4px solid currentColor;border-radius:3px;padding:12px 16px;background:rgba(255,255,255,.5)}
  .danger .head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .danger .desc{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
  .danger .why{margin:10px 0 0;font-size:14px;color:var(--ink)}
  .danger blockquote{margin:10px 0 0;padding:8px 12px;border-left:3px solid currentColor;background:rgba(255,255,255,.6);font-size:14px;color:var(--ink)}
  .danger .src{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
  .check{margin-top:9px;font-size:12px;color:var(--ink-3)}
  .check.ok::before{content:"✓ ";color:var(--lv1);font-weight:700}
  .check.todo::before{content:"○ ";color:var(--lv3);font-weight:700}

  /* 等级说明 */
  .legend{padding:28px 26px 30px}
  .legend h2{margin:0 0 8px;font-family:var(--brush);font-weight:400;font-size:28px}
  .legend p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
  .legend table{width:100%;border-collapse:collapse;font-size:14px}
  .legend td{padding:11px 8px;border-bottom:1px dashed var(--line-soft);vertical-align:top}
  .legend td:first-child{white-space:nowrap;font-weight:700;width:9.5em}
  .legend .lv-cell{display:block;margin-top:4px;font-size:13px;letter-spacing:.04em}
  .legend .names{display:block;color:var(--ink-3);font-size:12.5px;margin-top:5px;line-height:1.7}

  @media (max-width:560px){
    .sheet-inner{padding:0 18px 4px}
    .sheet-head{padding:26px 34px 20px 0;gap:14px}
    .sheet-head .glyph{width:62px;height:62px;font-size:38px}
    .sheet-head h2{font-size:28px}
    .head-cat{top:26px;right:0}
    .row{grid-template-columns:1fr;gap:4px}
    .hint{display:none}
    .legend{padding:24px 18px 26px}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes sheetIn{from{opacity:0;transform:scale(.975) translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="frame" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
</div>

<div class="wrap">
  <header class="masthead">
    <div class="seal-group" aria-hidden="true">
      <div class="seal">怪</div>
      <div class="seal-cap">山海拾遗</div>
    </div>
    <div class="mast-text">
      <div class="eyebrow">中华博物<i></i>典籍拾遗<i></i>凡三十种</div>
      <h1>中华精怪出没图鉴</h1>
      <p class="sub">中国版<em>「神奇动物在哪里」</em>——长什么样，在哪里出没，有多危险，遇见了怎么办。</p>
    </div>
    <div class="mast-side" aria-hidden="true">
      <div class="colophon">据山海经　搜神记<br>太平广记　聊斋志异等录</div>
      <div class="round-seal">卷<br>一</div>
    </div>
  </header>

  <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>

  <div class="toolbar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="按种类筛选"></div>
    <div class="grow"></div>
    <select class="select" id="lvsel" aria-label="按危险等级筛选">
      <option value="0">全部等级</option>
      <option value="1">一级·无害</option>
      <option value="2">二级·扰人</option>
      <option value="3">三级·伤人</option>
      <option value="4">四级·害命</option>
      <option value="5">五级·大凶</option>
    </select>
    <label class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg>
      <input class="search" id="q" type="search" placeholder="搜名字、出没地或出处" aria-label="搜索">
    </label>
    <button class="legend-btn" id="legendBtn" type="button">等级说明</button>
    <button class="rand" id="rand" type="button">随机遇见一只</button>
  </div>

  <main>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span>危险等级为本书自拟，每一级皆以原文为据。「已核」表示引文已对照公开古籍文本，「待核」表示尚未逐字核对。引文据传世本录出，不同版本字句略有出入。「遇见指南」为编者戏言，请勿当真。</span>
    <span class="foot-seal">姑妄言之</span>
  </footer>
</div>

<div class="mask" id="mask" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name">
    <div class="rod rod-top" aria-hidden="true"><i></i><span></span><i></i></div>
    <div class="sheet-inner">
      <button class="close" data-close type="button" aria-label="关闭">×</button>
      <div class="sheet-head">
        <div class="glyph" id="d-glyph"></div>
        <div>
          <h2 id="d-name"></h2>
          <p class="place" id="d-sub"></p>
        </div>
        <span class="head-cat" id="d-cat"></span>
        <span class="sheet-index" id="d-index"></span>
      </div>
      <dl class="sheet-body" id="d-body"></dl>
      <div class="sheet-foot">

  {n:"蜃", g:"蜃", c:"lin", place:"海边",

   src:"《史记·天官书》", q:"海旁蜄气象楼台；广野气成宫阙然。",
   lv:1, lq:"海旁蜄气象楼台。", ls:"《史记·天官书》", ok:false,

  {n:"彭侯", g:"彭", c:"cao", place:"建安郡的大樟树中",

   why:"它反而被人煮来吃了。",
   tip:"吴时陆敬叔把它煮来吃了，说味道像狗肉。本书不推荐效仿。",

  {n:"血树", g:"树", c:"cao", place:"张叔高家田中的大树",
   look:"树围十余抱，枝叶遍覆数亩地，树下不生五谷。", habit:"斧头砍下便流出赤汁；树空中藏有白头老人模样的怪物。",
   src:"《风俗通》，收入《太平广记》卷四百一十五", q:"遣客伐之，有赤汁六七斗出。",
   lv:2, lq:"叔高乃逆格之。如此凡数四头……而叔高恬如也。", ls:"《风俗通》，《太平广记》卷四百一十五", ok:true,
   why:"吓得众人伏地，但被斩之后，张叔高官运亨通，“竟无他怪”。",
   tip:"张叔高不信邪，持刀连斩数头怪物，反而平安无事。但本书建议还是先和树打个招呼。",
   note:"树被砍而出血，是汉魏六朝志怪中反复出现的母题，彭侯一条也是如此。"},
  {n:"菊精", g:"菊", c:"cao", place:"顺天马家的菊园",
   look:"化为一对姓陶的姐弟，姐姐名叫黄英。", habit:"善种菊，卖花致富；弟弟嗜酒，大醉后倒地化为菊花。",
   src:"蒲松龄《聊斋志异·黄英》", q:"",
   lv:1, lq:"（待补原文）", ls:"蒲松龄《聊斋志异·黄英》", ok:false,
   why:"它们是马家的亲友，帮马家致富。",
   tip:"可以买它们的花，别劝它们喝酒。",
   note:"清代的草木精已不再是六朝那种阴森的树怪，而是风雅的友人。《聊斋》里的牡丹精香玉、葛巾也是同类。"},

  {n:"细腰", g:"腰", c:"qi", place:"魏郡一座凶宅",
   look:"半夜有黄衣、青衣、白衣三人先后来问“细腰”，细腰一一作答。", habit:"黄衣是金，青衣是钱，白衣是银，细腰是灶下的杵。住进宅子的人纷纷生病。",
   src:"《搜神记》卷十八", q:"",
   lv:3, lq:"（待补原文：宅主一家患病）", ls:"《搜神记》卷十八", ok:false,
   why:"它们让宅中人生病，但何文偷听到真相后，便轻易除去了它们。",
   tip:"学何文。他半夜持刀坐在梁上偷听，天亮后照着对话一一去挖，得了金银和钱，把杵烧掉，宅子就安宁了。",
   note:"这是一类“窃听精怪对话而得宝”的故事，后世民间故事中常见类似情节。"},
  {n:"古镜", g:"镜", c:"qi", place:"随王度远行",
   look:"一面带有灵力的古铜镜。", habit:"一照之下，精怪皆现原形。王度曾用它照出程雄家的婢女鹦鹉原是千岁老狸。",
   src:"王度《古镜记》，收入《太平广记》卷二百三十，题《王度》", q:"",
   lv:1, lq:"（待补原文）", ls:"王度《古镜记》", ok:false,
   why:"它是照妖的宝物，只对精怪危险。",
   tip:"如果你有一面古镜，就不太需要本书了。",
   note:"鲁迅考证王度实已入唐，《古镜记》应算唐人作品。以镜照妖的观念，可上溯到葛洪《抱朴子》。"},

  {n:"宋定伯所卖之鬼", g:"鬼", c:"gui", place:"夜往宛市的路上",
   look:"与人无异；身体极轻。", habit:"只怕人的唾沫。",
   src:"《列异传》，又见《搜神记》", q:"",
   lv:2, lq:"唯不喜人唾。", ls:"《列异传》", ok:true,
   why:"它自己说出了弱点，结果被宋定伯背到市上，化为一只羊卖掉了。",
   tip:"学宋定伯。他自称新鬼，套出了鬼的弱点，到市上吐了口唾沫，卖得钱一千五百。",
   note:"《列异传》是这个故事的原出处，《搜神记》是转录。"},
  {n:"画皮", g:"皮", c:"gui", place:"太原王生的书房",
   look:"披上人皮时是少女；脱下人皮是面色青绿、牙齿如锯的恶鬼。", habit:"把人皮铺在床上，用彩笔描画，再披到身上。",
   src:"蒲松龄《聊斋志异·画皮》", q:"见一狞鬼，面翠色，齿巉巉如锯。铺人皮于榻上，执彩笔而绘之。",
   lv:5, lq:"见一狞鬼，面翠色，齿巉巉如锯。", ls:"《聊斋志异·画皮》", ok:true,
   why:"它伪装极好，王生事先已被道士警告，仍被它杀害、掏去了心。",
   tip:"路上独行的美人自称无家可归，先别带回家。",
   note:"王生最后是靠妻子陈氏忍辱求得乞丐相助，才得以复生。"},
  {n:"山臊", g:"臊", c:"gui", place:"西方深山",
   look:"赤身的小人。", habit:"捕食虾蟹，趁人夜宿，到火堆旁烤着吃，还偷人的盐。最怕竹子在火中爆裂的声响。",
   src:"《神异经》；南朝宗懔《荆楚岁时记》", q:"",
   lv:2, lq:"先于庭前爆竹，以辟山臊恶鬼。", ls:"宗懔《荆楚岁时记》", ok:false,
   why:"《神异经》只记它偷盐、借火；后世才称为“恶鬼”，一串爆竹就能吓跑。",
   tip:"过年放爆竹。",
   note:"正月初一放爆竹的风俗，最早的解释之一就是为了吓跑山臊。"}
];

const catOf = id => CATS.find(c => c.id === id);
const CN = ["零","一","二","三","四","五","六","七","八","九","十"];
const cn = n => n <= 10 ? CN[n] : n < 20 ? "十" + CN[n-10] : CN[Math.floor(n/10)] + "十" + (n % 10 ? CN[n%10] : "");
let current = "all", query = "", lvFilter = 0, visible = [], openIdx = -1;
const pips = n => `<span class="pips">${[1,2,3,4,5].map(i => `<span class="pip${i <= n ? " on" : ""}"></span>`).join("")}</span>`;

const tabsEl = document.getElementById("tabs");
function renderTabs(){
  const items = [{id:"all", name:"全部"}].concat(CATS);
  tabsEl.innerHTML = "";
  items.forEach(c => {
    const n = c.id === "all" ? DATA.length : DATA.filter(d => d.c === c.id).length;
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button";
    b.setAttribute("aria-pressed", String(current === c.id));
    b.innerHTML = `${c.name}<span class="n">${n}</span>`;
    b.onclick = () => { current = c.id; renderTabs(); renderGrid(); };
    tabsEl.appendChild(b);
  });
}

function matches(d){
  if (current !== "all" && d.c !== current) return false;
  if (lvFilter && d.lv !== lvFilter) return false;
  if (!query) return true;
  return [d.n, d.place, d.src, d.look, d.habit, d.q, d.lq, d.ls].join(" ").includes(query);
}

const gridEl = document.getElementById("grid");
function renderGrid(){
  visible = DATA.filter(matches);
  document.getElementById("count").textContent = `现录 ${cn(visible.length)} 种 · 全编共 ${cn(DATA.length)} 种`;
  gridEl.innerHTML = "";
  if (!visible.length){ gridEl.innerHTML = '<p class="empty">没有找到。也许它藏得太好了。</p>'; return; }
  visible.forEach((d, i) => {
    const cat = catOf(d.c), L = LEVELS[d.lv];
    const b = document.createElement("button");
    b.className = `card cat-${d.c}`; b.type = "button";
    b.style.setProperty("--i", i);
    b.setAttribute("aria-label", `${d.n}，${cat.name}，${L.name}`);
    b.innerHTML = `
      <div class="card-top"><span class="card-no">其${cn(i+1)}</span><span class="tag">${cat.name}</span></div>
      <div class="card-main">
        <div class="glyph">${d.g}</div>
        <div><h3>${d.n}</h3><p class="place">出没 · ${d.place}</p></div>
      </div>
      <div class="card-level" style="color:${L.color}">${pips(d.lv)}<span class="lv-text">${L.name}</span></div>
      <div class="card-foot"><span class="card-check ${d.ok ? "ok" : "todo"}">${d.ok ? "引文已核" : "引文待核"}</span><span class="more">展卷 →</span></div>`;
    b.onclick = () => openDetail(i);
    gridEl.appendChild(b);
  });
}

const mask = document.getElementById("mask"), legendMask = document.getElementById("legendMask");
let lastFocus = null;
function show(m){
  if (!m.classList.contains("open")) lastFocus = document.activeElement;
  m.classList.add("open"); m.setAttribute("aria-hidden","false");
  const sh = m.querySelector(".sheet"); if (sh) sh.scrollTop = 0;
  m.querySelector("[data-close]").focus();
}
function hide(m){
  m.classList.remove("open"); m.setAttribute("aria-hidden","true");
  if (m === mask) openIdx = -1;
  if (lastFocus) lastFocus.focus();
}

function openDetail(i){
  if (!visible.length) return;
  openIdx = (i + visible.length) % visible.length;
  const d = visible[openIdx], cat = catOf(d.c), L = LEVELS[d.lv];
  document.getElementById("sheet").className = `sheet cat-${d.c}`;
  const g = document.getElementById("d-glyph");
  g.textContent = d.g; g.className = "glyph";
  document.getElementById("d-name").textContent = d.n;
  document.getElementById("d-sub").textContent = `出没 · ${d.place}`;
  document.getElementById("d-cat").textContent = cat.name;
  document.getElementById("d-index").textContent = `其${cn(openIdx+1)} / 共${cn(visible.length)}种`;
  const quote = d.q ? `<div class="quote"><span class="src">${d.src}</span><p>${d.q}</p></div>` : `<span class="src-inline">${d.src}</span>`;
  document.getElementById("d-body").innerHTML = `
    <div class="row"><dt>危险等级</dt><dd><div class="danger" style="color:${L.color}">
      <div class="head">${pips(d.lv)}<span class="lv-text">${L.name}</span></div>
      <p class="desc">${L.desc}</p>
      <p class="why">${d.why}</p>
      <blockquote>${d.lq}<span class="src">${d.ls}</span></blockquote>
      <div class="check ${d.ok ? "ok" : "todo"}">${d.ok ? "定级引文已对照公开古籍文本" : "定级引文待核，请对照整理本"}</div>
    </div></dd></div>
    <div class="row"><dt>形貌</dt><dd>${d.look}</dd></div>
    <div class="row"><dt>习性</dt><dd>${d.habit}</dd></div>
    <div class="row"><dt>典出</dt><dd>${quote}</dd></div>
    <div class="row"><dt>遇见指南</dt><dd class="tip">${d.tip}</dd></div>
    <div class="row"><dt>小考</dt><dd class="note">${d.note}</dd></div>`;
  show(mask);
}

document.getElementById("lgTable").innerHTML = LEVELS.slice(1).map((L, i) => {
  const names = DATA.filter(d => d.lv === i + 1).map(d => d.n).join("、");
  return `<tr><td style="color:${L.color}">${pips(i+1)}<span class="lv-cell">${L.name}</span></td><td>${L.desc}<span class="names">${names}</span></td></tr>`;
}).join("");

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => hide(b.closest(".mask")));
document.getElementById("prev").onclick = () => openDetail(openIdx - 1);
document.getElementById("next").onclick = () => openDetail(openIdx + 1);
[mask, legendMask].forEach(m => m.addEventListener("click", e => { if (e.target === m) hide(m); }));
document.addEventListener("keydown", e => {
  const open = document.querySelector(".mask.open");
  if (!open) return;
  if (e.key === "Escape") hide(open);
  if (open === mask && e.key === "ArrowLeft") openDetail(openIdx - 1);
  if (open === mask && e.key === "ArrowRight") openDetail(openIdx + 1);
});
document.getElementById("legendBtn").onclick = () => show(legendMask);
document.getElementById("lvsel").onchange = e => { lvFilter = Number(e.target.value); renderGrid(); };
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); renderGrid(); });
document.getElementById("rand").onclick = () => {
  current = "all"; query = ""; lvFilter = 0;
  document.getElementById("q").value = ""; document.getElementById("lvsel").value = "0";
  renderTabs(); renderGrid();
  openDetail(Math.floor(Math.random() * visible.length));
};

renderTabs(); renderGrid();
</script>
</body>
</html>
